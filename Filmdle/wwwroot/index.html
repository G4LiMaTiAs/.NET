    <!DOCTYPE html>
    <html lang="pl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Filmdle - Nocne Kino (Prototyp)</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=VT323&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            :root {
                --sdv-night-top: #0b0e1f;
                --sdv-night-mid: #151730;
                --sdv-night-bot: #121212;
                --sdv-panel-bg: #1d192b;
                --sdv-panel-inset: #13101d;
                --sdv-wood-outer: #592d10;
                --sdv-wood-mid: #c87d3b;
                --sdv-wood-inner: #3c1e0a;
                --sdv-gold: #f5c518;
                --sdv-gold-bright: #ffe066;
                --sdv-crimson: #e50914;
                --sdv-amethyst: #9b5de5;
                --sdv-emerald: #2ec4b6;
                --sdv-text-cream: #fff5d6;
            }
    
            body.sdv-night-sky {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                background: linear-gradient(180deg, var(--sdv-night-top) 0%, var(--sdv-night-mid) 55%, var(--sdv-night-bot) 100%);
                color: var(--sdv-text-cream);
                font-family: 'Quicksand', sans-serif;
                position: relative;
                overflow-x: hidden;
                margin: 0;
                padding: 0;
            }
    
            main {
                flex: 1;
            }
    
            .starfield-overlay {
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 0;
                background-image: radial-gradient(2px 2px at 40px 60px, #fff8d6, transparent), radial-gradient(2px 2px at 180px 140px, #f5c518, transparent), radial-gradient(2px 2px at 340px 80px, #ffffff, transparent), radial-gradient(3px 3px at 520px 200px, #ffe066, transparent), radial-gradient(2px 2px at 760px 110px, #ffffff, transparent), radial-gradient(2px 2px at 920px 250px, #f5c518, transparent);
                background-size: 980px 340px;
                opacity: 0.45;
            }
    
            .pixel-font {
                font-family: 'VT323', monospace;
                letter-spacing: 0.5px;
            }
    
            .sdv-text-shadow {
                text-shadow: 3px 3px 0px #09060e;
            }
    
            .sdv-navbar-wrapper {
                background: rgba(22, 17, 34, 0.96);
                border-bottom: 4px solid var(--sdv-wood-mid);
                box-shadow: 0 4px 0 var(--sdv-wood-outer), 0 10px 24px rgba(0, 0, 0, 0.75);
            }
    
            .sdv-logo {
                font-family: 'VT323', monospace;
                font-size: 2.1rem;
                color: var(--sdv-gold) !important;
                text-shadow: 2px 2px 0 #3a1904;
                text-decoration: none;
            }
            .sdv-edition-tag {
                font-size: 0.95rem;
                background: var(--sdv-wood-outer);
                color: var(--sdv-gold-bright);
                border: 2px solid var(--sdv-wood-mid);
                padding: 1px 8px;
            }
    
            .sdv-nav-link {
                font-family: 'VT323', monospace;
                font-size: 1.35rem;
                color: var(--sdv-text-cream) !important;
                padding: 4px 12px !important;
                text-decoration: none;
                    border: 2px solid transparent;
            }
                    
            .sdv-nav-link:hover {
                    color: var(--sdv-gold) !important;
                    background: rgba(245, 197, 24, 0.12);
                    border-color: var(--sdv-wood-mid);
            }
                    
            .sdv-panel {
                    position: relative;
                    background: var(--sdv-panel-bg);
                    border: 4px solid var(--sdv-wood-outer);
                    box-shadow: inset 0 0 0 4px var(--sdv-wood-mid), inset 0 0 0 7px var(--sdv-wood-inner), 0 10px 0 rgba(0, 0, 0, 0.55), 0 14px 28px rgba(0, 0, 0, 0.7);
                    border-radius: 4px;
            }
                    
            .sdv-wood-inset {
                    background: var(--sdv-panel-inset);
                    border: 3px solid var(--sdv-wood-mid);
                    box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.75);
            }
                    
            .sdv-game-icon {
                    width: 58px;
                    height: 58px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 2rem;
                    background: var(--sdv-panel-inset);
                    border: 3px solid var(--sdv-wood-mid);
                    box-shadow: 0 4px 0 #000;
            }
                    
            .sdv-btn {
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    gap: 6px;
                    font-family: 'VT323', monospace;
                    font-size: 1.35rem;
                    padding: 8px 18px;
                    text-decoration: none;
                    cursor: pointer;
                    border-width: 3px;
                    border-style: solid;
            }
               .sdv-btn-gold {
            background: linear-gradient(180deg, #ffd43b 0%, #dca000 100%);
            color: #2b1402 !important;
            border-color: #fff3b0 #784a00 #573500 #fff3b0;
            box-shadow: 0 4px 0 #2b1402;
            font-weight: 700;
        }

        .sdv-btn-wood {
            background: linear-gradient(180deg, #8e4c1e 0%, #5c2e0e 100%);
            color: var(--sdv-text-cream) !important;
            border-color: #d68b52 #311705 #261103 #d68b52;
            box-shadow: 0 4px 0 #1a0b02;
        }

        .sdv-btn-crimson {
            background: linear-gradient(180deg, #e50914 0%, #9e040c 100%);
            color: #ffffff !important;
            border-color: #ff757c #4d0004 #380003 #ff757c;
            box-shadow: 0 4px 0 #260002;
        }

        .sdv-badge {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            padding: 2px 10px;
            border: 2px solid;
            display: inline-block;
        }

        .sdv-badge-gold {
            background: rgba(245, 197, 24, 0.18);
            border-color: var(--sdv-gold);
            color: var(--sdv-gold-bright);
        }

        .sdv-badge-emerald {
            background: rgba(46, 196, 182, 0.18);
            border-color: var(--sdv-emerald);
            color: #9bf6ff;
        }

        .sdv-input {
            background-color: #110d19 !important;
            border: 3px solid var(--sdv-wood-mid) !important;
            color: var(--sdv-text-cream) !important;
            border-radius: 0 !important;
            padding: 8px 12px;
        }

        .sdv-footer {
            background: rgba(14, 11, 22, 0.95);
            border-top: 4px solid var(--sdv-wood-mid);
        }
    </style>
</head>
